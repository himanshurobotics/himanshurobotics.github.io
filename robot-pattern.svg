
<svg width="120" height="120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="robotPattern" patternUnits="userSpaceOnUse" width="120" height="120">
      <!-- Circuit paths -->
      <path d="M20,20 L40,20 L40,40 L60,40 L60,60 L80,60 L80,80 L100,80" fill="none" stroke="#0e76a8" stroke-width="1" opacity="0.3"/>
      <path d="M20,100 L40,100 L40,80 L60,80 L60,60 L80,60 L80,40 L100,40" fill="none" stroke="#0e76a8" stroke-width="1" opacity="0.3"/>
      
      <!-- Robot head -->
      <rect x="45" y="45" width="30" height="30" fill="none" stroke="#0e76a8" stroke-width="1" opacity="0.2" rx="5"/>
      <circle cx="52" cy="55" r="3" fill="#0e76a8" opacity="0.2"/>
      <circle cx="68" cy="55" r="3" fill="#0e76a8" opacity="0.2"/>
      <rect x="55" y="62" width="10" height="6" fill="#0e76a8" opacity="0.2" rx="2"/>
      
      <!-- Circuit nodes -->
      <circle cx="20" cy="20" r="2" fill="#0e76a8" opacity="0.4"/>
      <circle cx="40" cy="40" r="2" fill="#0e76a8" opacity="0.4"/>
      <circle cx="60" cy="60" r="2" fill="#0e76a8" opacity="0.4"/>
      <circle cx="80" cy="80" r="2" fill="#0e76a8" opacity="0.4"/>
      <circle cx="100" cy="100" r="2" fill="#0e76a8" opacity="0.4"/>
      
      <!-- Gear elements -->
      <g transform="translate(10,10)">
        <circle cx="0" cy="0" r="8" fill="none" stroke="#0e76a8" stroke-width="1" opacity="0.2"/>
        <path d="M-6,-6 L6,6 M6,-6 L-6,6" stroke="#0e76a8" stroke-width="1" opacity="0.2"/>
      </g>
      
      <g transform="translate(110,110)">
        <circle cx="0" cy="0" r="6" fill="none" stroke="#0e76a8" stroke-width="1" opacity="0.2"/>
        <path d="M-4,-4 L4,4 M4,-4 L-4,4" stroke="#0e76a8" stroke-width="1" opacity="0.2"/>
      </g>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#robotPattern)"/>
</svg>
